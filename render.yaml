services:
  - type: web
    name: my-orbits-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AI_PROVIDER
        value: openrouter
      - key: DEMO_MODE
        value: "true"
      - key: NEO4J_URI
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
